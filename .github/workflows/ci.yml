name: ci

on:
  push:
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy statsmodels patsy matplotlib joblib PyYAML pytest
      - name: Compile
        run: python -m compileall -q mapsfs scripts plugins tests
      - name: Unit tests
        run: pytest -q
